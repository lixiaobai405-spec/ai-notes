[project]
name = "ai-notes-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi==0.143.0",
 "uvicorn[standard]==0.54.0",
 "sqlalchemy==2.1.4",
 "alembic==1.20.0",
 "psycopg[binary]==3.3.6",
 "pydantic-settings==2.15.0",
 "argon2-cffi==25.1.0",
 "pillow==12.3.0",
 "alibabacloud-oss-v2==1.4.0",
 "httpx==0.28.1",
 "pypdfium2==5.14.0",
 "markdown-it-py==4.2.0",
 "mdit-py-plugins==0.6.1",
]
[dependency-groups]
dev = ["pytest==8.3.5"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
