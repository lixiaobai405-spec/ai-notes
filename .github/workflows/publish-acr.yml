name: Publish development images to ACR
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-acr-development
  cancel-in-progress: false
jobs:
  select-ci:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
      run_id: ${{ steps.evidence.outputs.run_id }}
      attempt: ${{ steps.evidence.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select trusted CI evidence for this exact commit
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci_reuse_gate.py lookup
          --repository "$GITHUB_REPOSITORY"
          --repository-id "$GITHUB_REPOSITORY_ID"
          --sha "$GITHUB_SHA"
  verify:
    needs: select-ci
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      needs.select-ci.result == 'success' && needs.select-ci.outputs.reuse == 'false'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [select-ci, verify]
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' && needs.select-ci.result == 'success' &&
          ((needs.select-ci.outputs.reuse == 'true' && needs.verify.result == 'skipped') ||
           (needs.select-ci.outputs.reuse == 'false' && needs.verify.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ai-notes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the checked-out release commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate destination and choose a release tag
        run: |
          python3 - <<'PY'
          import os, re
          registry = os.environ.get("ACR_REGISTRY", "")
          if not re.fullmatch(r"crpi-[a-z0-9]+\.cn-hangzhou\.personal\.cr\.aliyuncs\.com", registry):
              raise SystemExit("Set the ACR_REGISTRY repository variable to the public Hangzhou personal instance hostname")
          PY
          printf 'RELEASE_TAG=sha-%s-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Build the backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/backend:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ai-notes-backend-linux-amd64,version=2
          cache-to: type=gha,scope=ai-notes-backend-linux-amd64,mode=max,version=2
      - name: Build the frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/frontend:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ai-notes-frontend-linux-amd64,version=2
          cache-to: type=gha,scope=ai-notes-frontend-linux-amd64,mode=max,version=2
      - name: Prepare the official PostgreSQL image
        run: |
          docker pull --platform linux/amd64 postgres:16.8-alpine
          docker tag postgres:16.8-alpine "$ACR_REGISTRY/$ACR_NAMESPACE/postgres:$RELEASE_TAG"
          printf 'PostgreSQL upstream: ' >> "$GITHUB_STEP_SUMMARY"
          docker image inspect postgres:16.8-alpine --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Revalidate reused CI evidence before registry login
        if: needs.select-ci.outputs.reuse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CI_RUN_ID: ${{ needs.select-ci.outputs.run_id }}
          EXPECTED_CI_ATTEMPT: ${{ needs.select-ci.outputs.attempt }}
        run: >-
          python3 scripts/ci_reuse_gate.py require
          --repository "$GITHUB_REPOSITORY"
          --repository-id "$GITHUB_REPOSITORY_ID"
          --sha "$GITHUB_SHA"
          --run-id "$EXPECTED_CI_RUN_ID"
          --attempt "$EXPECTED_CI_ATTEMPT"
      - name: Record successful full CI fallback
        if: needs.select-ci.outputs.reuse == 'false'
        run: |
          {
            printf '\n## CI authorization\n\n'
            printf 'Full CI succeeded in this release run: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Verified commit: `%s`\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticate to ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "$ACR_USERNAME" || { printf '%s\n' 'Missing ACR_USERNAME secret'; exit 1; }
          test -n "$ACR_PASSWORD" || { printf '%s\n' 'Missing ACR_PASSWORD secret'; exit 1; }
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
      - name: Publish all images and record the release
        run: |
          for image in backend frontend postgres; do
            docker push "$ACR_REGISTRY/$ACR_NAMESPACE/$image:$RELEASE_TAG"
          done
          {
            printf '\n## Development release\n\n'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'RELEASE_TAG=%s\n\n' "$RELEASE_TAG"
            for image in backend frontend postgres; do
              docker image inspect "$ACR_REGISTRY/$ACR_NAMESPACE/$image:$RELEASE_TAG" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$ACR_REGISTRY/$ACR_NAMESPACE/$image@"
            done
            printf '\nOnly deploy after this job has completed successfully.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the registry login from this runner
        if: always()
        run: |
          if [ -n "$ACR_REGISTRY" ]; then docker logout "$ACR_REGISTRY"; fi
