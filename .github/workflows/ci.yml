name: Project checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: notes
          POSTGRES_DB: notes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notes -d notes_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://notes:notes@localhost:5432/notes_test
      TEST_DATABASE_URL: postgresql+psycopg://notes:notes@localhost:5432/notes_test
      APP_ORIGIN: http://testserver
      RATE_LIMIT_REQUESTS: 1000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.lock
        working-directory: backend
      - run: |
          alembic upgrade head
          alembic downgrade c2e41a9f3b67
          alembic upgrade head
          alembic check
          pytest -q
        working-directory: backend
        env:
          SITE_BACKUP_TEST_CONTAINER: ${{ job.services.postgres.id }}
      - run: PYTHONPATH=. python scripts/export_openapi.py
        working-directory: backend
      - run: npm ci && npm run check:types && npm run build
        working-directory: frontend
      - run: node --experimental-strip-types --test frontend/tests/*.test.mjs
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: git diff --exit-code -- backend/openapi.json
      - run: cp .env.example .env && docker compose config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      # PR builds may restore main's layers; only trusted main runs export them.
      - name: Build the backend verification image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          load: true
          tags: ai-notes-https-python:latest
          cache-from: type=gha,scope=ai-notes-backend-linux-amd64,version=2
          cache-to: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'type=gha,scope=ai-notes-backend-linux-amd64,mode=max,version=2' || '' }}
      - name: Build the frontend verification image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: false
          load: true
          tags: ai-notes-https-validation:latest
          cache-from: type=gha,scope=ai-notes-frontend-linux-amd64,version=2
          cache-to: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'type=gha,scope=ai-notes-frontend-linux-amd64,mode=max,version=2' || '' }}
      - name: Verify isolated IP HTTPS
        run: |
          python -m unittest discover -s tests/https_fixtures -p "test_*.py"
          python scripts/verify_https_isolated.py --frontend-image ai-notes-https-validation --python-image ai-notes-https-python
